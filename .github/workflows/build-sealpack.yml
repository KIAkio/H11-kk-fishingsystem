name: Build Sealpack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read package version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' sealpack/info.toml | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SEALPACK_FILE=goblin-backpack-$VERSION.sealpack" >> "$GITHUB_ENV"

      - name: JavaScript syntax check
        run: node --check sealpack/scripts/main.js

      - name: Validate and pack Sealpack
        run: |
          npx --yes sealpack@0.1.2 validate sealpack
          mkdir -p dist
          npx --yes sealpack@0.1.2 pack sealpack --out "dist/$SEALPACK_FILE"
          cp "dist/$SEALPACK_FILE" dist/goblin-backpack.sealpack

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: 地精背包核心 v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/${{ env.SEALPACK_FILE }}
            dist/goblin-backpack.sealpack

  fishing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read fishing package version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' fishing-sealpack/info.toml | head -n 1)"
          test -n "$VERSION"
          echo "FISHING_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate and pack fishing Sealpack
        run: |
          node --check fishing-sealpack/scripts/main.js
          npx --yes sealpack@0.1.2 validate fishing-sealpack
          mkdir -p dist
          npx --yes sealpack@0.1.2 pack fishing-sealpack --out "dist/h11-fishing-$FISHING_VERSION.sealpack"
          cp "dist/h11-fishing-$FISHING_VERSION.sealpack" dist/h11-fishing.sealpack

      - name: Publish fishing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fishing-v${{ env.FISHING_VERSION }}
          name: H11 钓鱼系统 v${{ env.FISHING_VERSION }}
          generate_release_notes: true
          files: |
            dist/h11-fishing-${{ env.FISHING_VERSION }}.sealpack
            dist/h11-fishing.sealpack

  all-in-one:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read all-in-one version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' h11-all-in-one/info.toml | head -n 1)"
          test -n "$VERSION"
          echo "ALL_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate and pack H11 all-in-one
        run: |
          for file in h11-all-in-one/scripts/*.js; do node --check "$file"; done
          npx --yes sealpack@0.1.2 validate h11-all-in-one
          mkdir -p dist
          npx --yes sealpack@0.1.2 pack h11-all-in-one --out "dist/h11-all-in-one-$ALL_VERSION.sealpack"
          cp "dist/h11-all-in-one-$ALL_VERSION.sealpack" dist/h11-all-in-one.sealpack

      - name: Publish all-in-one GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: h11-all-v${{ env.ALL_VERSION }}
          name: H11 冬训营整合包 v${{ env.ALL_VERSION }}
          generate_release_notes: true
          files: |
            dist/h11-all-in-one-${{ env.ALL_VERSION }}.sealpack
            dist/h11-all-in-one.sealpack
