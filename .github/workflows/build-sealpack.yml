name: Build Sealpack

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate and pack Sealpack
        run: |
          npx --yes sealpack@0.1.2 validate sealpack
          mkdir -p dist
          npx --yes sealpack@0.1.2 pack sealpack --out dist/goblin-backpack-1.1.0.sealpack
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: 地精背包核心 v1.1.0
          generate_release_notes: true
          files: dist/goblin-backpack-1.1.0.sealpack
