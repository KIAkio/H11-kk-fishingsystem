name: Build Goblin Gathering Sealpack

on:
  push:
    branches: [main]
    paths:
      - 'gathering-sealpack/**'
      - '.github/workflows/build-gathering.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read package version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' gathering-sealpack/info.toml | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Validate and pack
        run: |
          npx --yes sealpack@0.1.2 validate gathering-sealpack
          mkdir -p dist
          npx --yes sealpack@0.1.2 pack gathering-sealpack --out dist/goblin-gathering.sealpack
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: goblin-gathering-v${{ env.VERSION }}
          name: 地精采集系统 v${{ env.VERSION }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: dist/goblin-gathering.sealpack
