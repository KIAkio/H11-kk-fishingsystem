name: Build Winter Camp Life Sealpack

on:
  push:
    branches: [main]
    paths:
      - 'camp-life-sealpack/**'
      - '.github/workflows/build-camp-life.yml'
  workflow_dispatch:

concurrency:
  group: camp-life-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read package version
        shell: bash
        run: |
          VERSION="$(grep -A 8 '^\[package\]' camp-life-sealpack/info.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: JavaScript syntax check
        run: node --check camp-life-sealpack/scripts/main.js
      - name: Validate and pack
        run: |
          npx --yes sealpack@0.1.2 validate camp-life-sealpack
          mkdir -p dist
          npx --yes sealpack@0.1.2 pack camp-life-sealpack --out dist/winter-camp-life.sealpack
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="winter-camp-life-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/winter-camp-life.sealpack --clobber
          else
            gh release create "$TAG" dist/winter-camp-life.sealpack --title "冬训营生活系统 v$VERSION" --target main --generate-notes --latest=false
          fi
